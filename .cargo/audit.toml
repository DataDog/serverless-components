# These rustls advisories are fixed in rustls >= 0.23.46, but every version
# from 0.23.45 onward requires aws-lc-rs >= 1.18, which pulls in AWS-LC-FIPS
# 4.x, pending FIPS 140-3 certification. Remove these ignores once a
# FIPS-certified aws-lc-rs is available.
#
# RUSTSEC-2026-0285: TLS 1.3 handshake messages accepted across encryption
#   level boundaries.
# RUSTSEC-2026-0348: Brotli cert-decompression DoS; the brotli feature is not
#   enabled (default-features = false in crates/datadog-fips).
# RUSTSEC-2026-0349: ServerHello downgrade loses post-quantum confidentiality.
#   The FIPS provider puts X25519MLKEM768 after P-256 and P-384, so the client
#   sends a classical key share unless the server asks for the hybrid group
#   with a HelloRetryRequest, and the advisory excludes those servers.
# RUSTSEC-2026-0346: derived Debug impls can expose TLS session secrets, but
#   only for custom ClientSessionStore implementations that log them.
[advisories]
ignore = [
    "RUSTSEC-2026-0285",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0346",
]
