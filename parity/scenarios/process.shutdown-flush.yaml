# Spans, metrics and logs at set points across 25 seconds, so that every area flushes at least
# twice, then a last batch shortly before SIGTERM, which the agent must flush before it exits.
# The step clock is aligned to the 10-second wall clock, so Go's metric buckets fall at the same
# phase in every run. The harness times SIGTERM from the step clock, so the last batch at 25s comes
# 100 milliseconds before the SIGTERM at 25.1s, whatever the binary's startup time.
name: process.shutdown-flush
priority: P0
features: [process.shutdown-flush, traces.flush-interval]
coverage_gap: "The workload's metrics fill only two or three 10-second buckets, so timing.interval.series, timing.interval.sketches and timing.flush_interval.sketches are not measurable. A slow DogStatsD path with a normal agent flush is caught only by timing.max_delay of series and sketches, and only when a send lands shortly after a flush, so it can pass: timing.flush_interval.series cannot see it, because the agent's own metrics keep flushing every 3 seconds."
mode: in-container
platform: local
align: {every: 10s, offset: 500ms}
environment:
  DD_SERVICE: parity-app
  DD_LOGS_ENABLED: "true"
workload:
  - at: 1s
    send_spans: {fixture: send-1-v04}
  - at: 1s
    send_dogstatsd: ["parity.requests:1|c|#send:1", "parity.latency:10|d|#send:1"]
  - at: 1s
    print: {stream: stdout, lines: ["parity-child: send 1"]}
  - at: 4s
    send_dogstatsd: ["parity.requests:1|c|#send:2", "parity.latency:20|d|#send:2"]
  - at: 4s
    print: {stream: stdout, lines: ["parity-child: send 2"]}
  - at: 7s
    send_spans: {fixture: send-2-v04}
  - at: 7s
    send_dogstatsd: ["parity.requests:1|c|#send:3", "parity.latency:30|d|#send:3"]
  - at: 7s
    print: {stream: stdout, lines: ["parity-child: send 3"]}
  - at: 10s
    send_dogstatsd: ["parity.requests:1|c|#send:4", "parity.latency:40|d|#send:4"]
  - at: 10s
    print: {stream: stdout, lines: ["parity-child: send 4"]}
  - at: 13s
    send_spans: {fixture: send-3-v04}
  - at: 13s
    send_dogstatsd: ["parity.requests:1|c|#send:5", "parity.latency:50|d|#send:5"]
  - at: 13s
    print: {stream: stdout, lines: ["parity-child: send 5"]}
  - at: 16s
    send_dogstatsd: ["parity.requests:1|c|#send:6", "parity.latency:60|d|#send:6"]
  - at: 16s
    print: {stream: stdout, lines: ["parity-child: send 6"]}
  - at: 19s
    send_spans: {fixture: send-4-v04}
  - at: 19s
    send_dogstatsd: ["parity.requests:1|c|#send:7", "parity.latency:70|d|#send:7"]
  - at: 19s
    print: {stream: stdout, lines: ["parity-child: send 7"]}
  - at: 22s
    send_dogstatsd: ["parity.requests:1|c|#send:8", "parity.latency:80|d|#send:8"]
  - at: 22s
    print: {stream: stdout, lines: ["parity-child: send 8"]}
  - at: 25s
    send_spans: {fixture: send-5-v04}
  - at: 25s
    send_dogstatsd: ["parity.requests:1|c|#send:9", "parity.latency:90|d|#send:9"]
  - at: 25s
    print: {stream: stdout, lines: ["parity-child: send 9"]}
  - wait_for_signal: {signal: SIGTERM, then: [{exit: 0}]}
stop:
  send_signal: {signal: SIGTERM, after_seconds: 25.1}
