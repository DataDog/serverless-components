# Azure Container Apps: the platform variables of platforms/container-app.env. Everything comes
# from the environment, so there is no metadata server. The child sends a span, a DogStatsD metric
# and a log line, so the Container Apps tags are compared on all three, as are the enhanced
# metrics Go emits on Container Apps (azure.app_containerapps.enhanced.* and the legacy
# azure.containerapp.enhanced.* names). The scenario checks tags, not timing, so it sets no align.
name: platform.container-app
priority: P0
features: [platform.detection, platform.tag-sets, traces.span-tags-and-origin]
mode: in-container
platform: container-app
environment:
  DD_SERVICE: parity-app
  DD_LOGS_ENABLED: "true"
workload:
  - at: 1s
    send_spans: {fixture: send-1-v04}
  - at: 1s
    send_dogstatsd: ["parity.requests:1|c|#route:/"]
  - at: 1s
    print: {stream: stdout, lines: ["parity-child: container app log"]}
  - at: 2s
    exit: 0
compare:
  # As for datadog.serverless_agent.enhanced.cpu.usage in compare-defaults.yaml: the CPU that
  # serverless-init uses differs between any two runs, so the sketch must be present and every
  # value above zero.
  overrides:
    - path: sketches[metric=azure.app_containerapps.enhanced.cpu.usage,*].sum
      comparator: greater_than
      value: 0
    - path: sketches[metric=azure.app_containerapps.enhanced.cpu.usage,*].min
      comparator: greater_than
      value: 0
    - path: sketches[metric=azure.app_containerapps.enhanced.cpu.usage,*].max
      comparator: greater_than
      value: 0
    - path: sketches[metric=azure.app_containerapps.enhanced.cpu.usage,*].quantiles[*]
      comparator: greater_than
      value: 0
