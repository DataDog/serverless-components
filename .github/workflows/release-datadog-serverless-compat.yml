name: Release Datadog Serverless Compat

on: workflow_dispatch

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    uses: ./.github/workflows/build-datadog-serverless-compat.yml
    with:
      runner: ${{matrix.runner}}
  release:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out the audited source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # 4.3.0
        with:
          path: target/bin
      - run: |
          chmod +x target/bin/linux-amd64/datadog-serverless-compat
          chmod +x target/bin/windows-amd64/datadog-serverless-compat.exe
      - name: Install Rust toolchain for cargo-audit
        uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0
        with:
          cache: false
      - name: Strict cargo-audit release gate
        working-directory: source
        run: ./scripts/cargo-audit-release-gate.sh "$GITHUB_SHA"
      - run: zip -r datadog-serverless-compat.zip ./*
        working-directory: target
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          draft: true
          generate_release_notes: true
          files: target/datadog-serverless-compat.zip
