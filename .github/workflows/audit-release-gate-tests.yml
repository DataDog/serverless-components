name: Audit Release Gate Tests

on:
  pull_request:
    paths:
      - '.github/workflows/audit-release-gate-tests.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-datadog-serverless-compat.yml'
      - '.github/workflows/build-datadog-serverless-compat.yml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'scripts/cargo-audit-release-gate.sh'
      - 'scripts/cargo-audit-report-guard.sh'
      - 'scripts/tests/audit-release-gate/**'
  workflow_dispatch:
    inputs:
      network_smoke:
        description: 'Also run the opt-in real-scanner network smoke suite'
        required: false
        type: boolean
        default: false

# Read-only: this check never publishes, signs, or uploads anything.
permissions:
  contents: read

jobs:
  offline:
    name: Offline gate tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run deterministic offline gate tests
        run: |
          python3 -m unittest discover -v -s scripts/tests/audit-release-gate -p 'test_*.py'

  network-smoke:
    name: Opt-in real-scanner smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.network_smoke }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0
        with:
          cache: false
      - name: Run real scanner download, checksum, refresh, and scan
        run: python3 scripts/tests/audit-release-gate/network_smoke.py
