[package]
name = "datadog-fips"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.12.4", features = ["json", "http2"], default-features = false }
# Resolved version is intentionally held below 0.23.45 (see .cargo/audit.toml): that version
# requires aws-lc-rs >= 1.18, which pulls in AWS-LC-FIPS 4.x, pending FIPS 140-3 certification.
# Do not bump until a FIPS-certified aws-lc-rs is available, or a future `cargo update` will re-bump it.
rustls = { version = ">=0.23.18, <0.23.45", default-features = false, features = ["fips"], optional = true }
rustls-native-certs = { version = ">=0.8.1, <0.8.3", optional = true }
tracing = { version = "0.1.40", default-features = false }

[features]
default = [ "reqwest/rustls-tls" ]
fips = [ "reqwest/rustls-tls-no-provider", "rustls", "rustls-native-certs" ]
