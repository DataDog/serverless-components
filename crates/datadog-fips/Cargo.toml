[package]
name = "datadog-fips"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.12.4", features = ["json", "http2"], default-features = false }
rustls = { version = "0.23.18", default-features = false, features = ["fips"], optional = true }
rustls-native-certs = { version = ">=0.8.1, <0.8.3", optional = true }
# Constrain the transitive backend to retain AWS-LC-FIPS 3.x.
# aws-lc-rs 1.18 switches to AWS-LC-FIPS 4.x; lift this bound only
# after its certification is verified. See .cargo/audit.toml.
aws-lc-rs = { version = ">=1, <1.18", default-features = false, optional = true }
tracing = { version = "0.1.40", default-features = false }

[features]
default = [ "reqwest/rustls-tls" ]
fips = [ "reqwest/rustls-tls-no-provider", "rustls", "rustls-native-certs", "dep:aws-lc-rs" ]
